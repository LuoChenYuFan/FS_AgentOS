[project]
name = "fs-orchestrator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "fs-eventbus",
    "fs-agent-runtime",
    "fs-skill-runtime",
    "fs-memory-service",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_orchestrator"]

[tool.uv.sources]
fs-common = { workspace = true }
fs-eventbus = { workspace = true }
fs-agent-runtime = { workspace = true }
fs-skill-runtime = { workspace = true }
fs-memory-service = { workspace = true }
