[project]
name = "fs-agent-runtime"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "httpx>=0.27.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_agent_runtime"]

[tool.uv.sources]
fs-common = { workspace = true }
