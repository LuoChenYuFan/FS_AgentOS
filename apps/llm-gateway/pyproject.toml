[project]
name = "fs-llm-gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_llm_gateway"]

[tool.uv.sources]
fs-common = { workspace = true }
