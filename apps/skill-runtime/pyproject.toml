[project]
name = "fs-skill-runtime"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "fs-skill-sdk",
    "fs-tool-interceptor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_skill_runtime"]

[tool.uv.sources]
fs-common = { workspace = true }
fs-skill-sdk = { workspace = true }
fs-tool-interceptor = { workspace = true }
