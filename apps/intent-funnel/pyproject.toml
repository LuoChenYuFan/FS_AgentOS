[project]
name = "fs-intent-funnel"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "fs-orchestrator",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_intent_funnel"]

[tool.uv.sources]
fs-common = { workspace = true }
fs-orchestrator = { workspace = true }
