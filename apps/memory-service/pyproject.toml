[project]
name = "fs-memory-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "fs-memory-sdk",
    "redis>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_memory_service"]

[tool.uv.sources]
fs-common = { workspace = true }
fs-memory-sdk = { workspace = true }
