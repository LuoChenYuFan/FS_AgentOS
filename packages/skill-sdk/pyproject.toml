[project]
name = "fs-skill-sdk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fs-common",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fs_skill_sdk"]

[tool.uv.sources]
fs-common = { workspace = true }
